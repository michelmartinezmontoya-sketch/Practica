<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Edad</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(30, 45, 65);
            text-align: center;
            padding-top: 50px;
        }

        .contenedor {
            background-color: rgba(205, 219, 236, 0.801);
            width: 450px;
            margin: auto;
            padding: 20px;
            border-radius: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .descripcion {
            color: #000000;
            margin-bottom: 25px;
        }

        table {
            margin: auto;
            border-spacing: 12px;
        }

        input {
            width: 90px;
            padding: 8px;
            text-align: center;
            border: 1px solid #bbb;
            border-radius: 8px;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: rgb(27, 18, 156);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #223bcc;
        }

        #resultado {
            margin-top: 25px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h2>Calculadora de Edad</h2>

        <p class="descripcion">
            Ingresa tu fecha de nacimiento
        </p>

        <table>

            <tr>
                <th>Día</th>
                <th>Mes</th>
                <th>Año</th>
            </tr>

            <tr>
                <td>
                    <input
                        type="number"
                        id="dia"
                        min="1"
                        max="31"
                        placeholder="DD">
                </td>

                <td>
                    <input
                        type="number"
                        id="mes"
                        min="1"
                        max="12"
                        placeholder="MM">
                </td>

                <td>
                    <input
                        type="number"
                        id="anio"
                        placeholder="AAAA">
                </td>
            </tr>

        </table>

        <button id="myBtn">
            Calcular edad
        </button>

        <p id="resultado"></p>

    </div>

    <script src="../dist/index.js"></script>

</body>

</html>
